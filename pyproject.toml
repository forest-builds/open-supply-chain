[project]
name = "open-supply-chain"
version = "0.1.0"
description = "Open supply-chain intelligence infrastructure."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.100.0",
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "httpx>=0.28.0",
  "osmium>=4.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "requests>=2.32.0",
  "shapely>=2.0.6",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=api --cov=pipelines --cov=sources --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["api*", "pipelines*", "sources*"]
exclude = ["app*", "db*", "docs*"]
