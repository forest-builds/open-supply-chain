<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>__TITLE__</title>
<style>
:root { color-scheme: light dark; }
body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0; padding: 2rem 1rem; background: #0b0d10; color: #e8eaed; }
main { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
.sub { color: #9aa0a6; margin: 0 0 1.5rem; font-size: .9rem; }
.state { display: inline-block; padding: .35rem .75rem; border-radius: 999px;
  font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .8rem;
  background: #1a73e8; color: #fff; }
.metrics { display: flex; gap: 1.5rem; margin: 1.25rem 0; flex-wrap: wrap; }
.metric .v { font-size: 1.6rem; font-weight: 700; }
.metric .l { color: #9aa0a6; font-size: .8rem; text-transform: uppercase; }
h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .05em;
  color: #9aa0a6; margin: 2rem 0 .5rem; border-bottom: 1px solid #2a2d31; padding-bottom: .35rem; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #2a2d31; }
th { color: #9aa0a6; font-weight: 600; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
ul { padding-left: 1.2rem; }
footer { margin-top: 2.5rem; color: #9aa0a6; font-size: .8rem;
  border-top: 1px solid #2a2d31; padding-top: 1rem; }
a { color: #8ab4f8; }
