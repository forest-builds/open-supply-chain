[project]
name = "the-state-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "the-state-products",
    "the-state-payments",
    "the-state-ingestion",
]

[project.scripts]
the-state-nyc-artifact = "cli.nyc_living_artifact:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "models", "routes", "schemas", "services"]
