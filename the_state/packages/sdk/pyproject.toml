[project]
name = "the-state-sdk"
version = "0.1.0"
description = "Official Python SDK for The State — ground-truth operational state."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["the_state_sdk"]
