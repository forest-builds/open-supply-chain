source_name: openstreetmap
api_url: https://overpass-api.de/api/interpreter
api_urls:
  - https://overpass-api.de/api/interpreter
  - https://overpass.kumi.systems/api/interpreter
  - https://overpass.openstreetmap.ru/api/interpreter
auth_required: false
refresh_rate: weekly_for_mvp
raw_schema: overpass_json
canonical_entities_created:
  - areas_of_interest
  - locations
  - ports
  - facilities
  - routes
cleaning_rules:
  - preserve raw Overpass JSON in raw_ingestions
  - normalize OSM ids as osm_type/osm_id and source_entity_id
  - keep all OSM tags in source_tags JSONB
  - convert point/line/polygon geometry into PostGIS geometry
join_keys:
  - osm_type
  - osm_id
geo_fields:
  - lat
  - lon
  - center
  - geometry
confidence_score: 0.7
license: ODbL 1.0
attribution: OpenStreetMap contributors
